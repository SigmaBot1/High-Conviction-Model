<svg width="680" height="920" viewBox="0 0 680 920" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117;font-family:Arial,Helvetica,sans-serif">

<!-- Title block -->
<rect x="40" y="30" width="600" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
<text x="340" y="56" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="600">Quality · Value · Momentum</text>
<text x="340" y="78" text-anchor="middle" fill="#8b949e" font-size="12">Quantitative stock selection engine — 900 stocks → top 10 quarterly picks</text>

<!-- Step 1: Quality -->
<rect x="40" y="130" width="600" height="110" rx="12" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="155" fill="#9FE1CB" font-size="14" font-weight="600">Step 1 — Quality screen</text>
<text x="60" y="178" fill="#5DCAA5" font-size="12">Scan ~900 stocks through 7 fundamental filters. All must pass.</text>
<text x="60" y="198" fill="#5DCAA5" font-size="12">Revenue growth >15%  ·  Gross margin >40%  ·  ROIC >15%</text>
<text x="60" y="218" fill="#5DCAA5" font-size="12">D/E &lt;1  ·  Positive FCF  ·  PEG &lt;2  ·  FCF yield >1.5%</text>
<text x="620" y="155" text-anchor="end" fill="#8b949e" font-size="11">~900 in</text>

<!-- Arrow down -->
<line x1="340" y1="240" x2="340" y2="270" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="356" y="258" fill="#8b949e" font-size="11">10-25 survive</text>

<!-- Step 2: Value -->
<rect x="40" y="275" width="290" height="120" rx="12" fill="#042C53" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="300" text-anchor="middle" fill="#85B7EB" font-size="14" font-weight="600">Step 2 — Value score</text>
<text x="185" y="322" text-anchor="middle" fill="#85B7EB" font-size="12">50% of final ranking</text>
<text x="60" y="348" fill="#B5D4F4" font-size="12">⅓  Earnings yield (EBIT/EV)</text>
<text x="60" y="368" fill="#B5D4F4" font-size="12">⅓  P/S vs own 3yr history</text>
<text x="60" y="388" fill="#B5D4F4" font-size="12">⅓  Free cash flow yield</text>

<!-- Step 3: Momentum -->
<rect x="350" y="275" width="290" height="120" rx="12" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
<text x="495" y="300" text-anchor="middle" fill="#AFA9EC" font-size="14" font-weight="600">Step 3 — Momentum score</text>
<text x="495" y="322" text-anchor="middle" fill="#AFA9EC" font-size="12">50% of final ranking</text>
<text x="370" y="355" fill="#CECBF6" font-size="12">6-month price return</text>
<text x="370" y="375" fill="#CECBF6" font-size="12">Ranked vs other quality stocks</text>

<!-- Merge arrows -->
<line x1="185" y1="395" x2="290" y2="430" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="495" y1="395" x2="390" y2="430" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

<!-- Step 4: Composite -->
<rect x="200" y="430" width="280" height="60" rx="12" fill="#412402" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="455" text-anchor="middle" fill="#FAC775" font-size="14" font-weight="600">Step 4 — Composite ranking</text>
<text x="340" y="475" text-anchor="middle" fill="#EF9F27" font-size="12">50% value + 50% momentum → top 10</text>

<line x1="340" y1="490" x2="340" y2="520" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

<!-- Step 5: Portfolio -->
<rect x="40" y="520" width="600" height="100" rx="12" fill="#173404" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="548" fill="#C0DD97" font-size="14" font-weight="600">Step 5 — Hold for the quarter</text>
<text x="60" y="572" fill="#97C459" font-size="12">10 equal-weight positions (~10% each). Hold until next rebalance.</text>
<text x="60" y="592" fill="#97C459" font-size="12">Only exit: 15% trailing stop from peak price. No replacement until rebalance.</text>

<line x1="340" y1="620" x2="340" y2="650" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="356" y="638" fill="#8b949e" font-size="11">90 days later</text>

<!-- Step 6: Rebalance -->
<rect x="120" y="655" width="440" height="60" rx="12" fill="#4A1B0C" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="680" text-anchor="middle" fill="#F0997B" font-size="14" font-weight="600">Step 6 — Quarterly rebalance</text>
<text x="340" y="700" text-anchor="middle" fill="#F5C4B3" font-size="12">Re-run ranking. Sell drops, buy new entries. Repeat.</text>

<!-- Return arrow -->
<path d="M120 685 L80 685 L80 180 L120 180" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>

<!-- Bottom stats -->
<rect x="40" y="750" width="600" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
<text x="340" y="776" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="600">Why it works</text>

<rect x="40" y="810" width="186" height="80" rx="8" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
<text x="133" y="838" text-anchor="middle" fill="#9FE1CB" font-size="14" font-weight="600">Quality</text>
<text x="133" y="858" text-anchor="middle" fill="#5DCAA5" font-size="12">Avoids cheap junk</text>
<text x="133" y="876" text-anchor="middle" fill="#5DCAA5" font-size="12">and value traps</text>

<rect x="247" y="810" width="186" height="80" rx="8" fill="#042C53" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="838" text-anchor="middle" fill="#85B7EB" font-size="14" font-weight="600">Value</text>
<text x="340" y="858" text-anchor="middle" fill="#85B7EB" font-size="12">Avoids overpaying</text>
<text x="340" y="876" text-anchor="middle" fill="#85B7EB" font-size="12">for momentum</text>

<rect x="454" y="810" width="186" height="80" rx="8" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
<text x="547" y="838" text-anchor="middle" fill="#AFA9EC" font-size="14" font-weight="600">Momentum</text>
<text x="547" y="858" text-anchor="middle" fill="#AFA9EC" font-size="12">Avoids stagnant</text>
<text x="547" y="876" text-anchor="middle" fill="#AFA9EC" font-size="12">quality stocks</text>

<!-- Arrow marker -->
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
</svg>
